name: Probe horde step
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Same commands as the bot step
        run: |
          set -uo pipefail
          base="https://github.com/Belzedar94/Horde-Stockfish/releases/download/v1.0.0"
          installed=""
          for build in Horde-Stockfish-1.0.0-linux-x86-64-bmi2 Horde-Stockfish-1.0.0-linux-x86-64-avx2; do
            echo "Trying ${build}"
            if ! curl -fsSL --retry 3 --retry-delay 2 -o /tmp/horde.tar.xz "${base}/${build}.tar.xz"; then
              echo "::warning::Download failed for ${build}"
              continue
            fi
            rm -rf /tmp/horde-dist && mkdir -p /tmp/horde-dist
            tar -xf /tmp/horde.tar.xz -C /tmp/horde-dist
            binary=$(find /tmp/horde-dist -type f -name 'horde-stockfish' | head -n1)
            test -n "${binary}" || continue
            mkdir -p engines
            install -m 755 "${binary}" engines/horde-stockfish || continue
            printf 'uci\nquit\n' | ./engines/horde-stockfish > /tmp/horde-uci.txt 2>&1 || true
            echo "--- uci probe ---"
            head -n 4 /tmp/horde-uci.txt
            if grep -q 'UCI_Variant' /tmp/horde-uci.txt; then
              ./engines/horde-stockfish bench 16 1 1 > /tmp/horde-bench.txt 2>&1 || true
              echo "--- bench probe ---"
              tail -n 4 /tmp/horde-bench.txt
              if grep -q 'Nodes/second' /tmp/horde-bench.txt; then
                grep -m1 'id name' /tmp/horde-uci.txt
                echo "Using ${build}"
                installed="yes"
                break
              fi
            fi
            echo "::warning::${build} does not run here, trying the next build"
            rm -f engines/horde-stockfish
          done
          if [ -z "${installed}" ]; then
            echo "::warning::Horde-Stockfish is unusable on this runner, horde falls back to Fairy-Stockfish."
            sed -i '/horde: "horde-stockfish"/d' config.github.yml
            rm -f engines/horde-stockfish
          fi
          grep -n -A3 'variant_engines' config.github.yml