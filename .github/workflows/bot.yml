name: Lichess bot

# GitHub Actions caps a single job at 6 hours, so the bot plays for 5h50m and the restart is queued. The cron runs
# every hour and the concurrency group keeps one run queued, so the next run starts as soon as
# the active one stops. That also restarts the bot automatically after a crash.

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to run, in minutes (350 is the maximum that fits the 6 hour job limit)"
        required: false
        default: "350"

permissions:
  contents: write

concurrency:
  group: lichess-bot
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Stockfish
        run: |
          set -euo pipefail
          mkdir -p engines
          api="https://api.github.com/repos/official-stockfish/Stockfish/releases/latest"
          # Take the exact asset URL the API reports, so a renamed or re-hosted release cannot break the job.
          url=$(curl -fsSL "$api" \
            | grep -oE '"browser_download_url": *"[^"]*stockfish-linux-x86-64[^"]*\.tar\.gz"' \
            | head -n1 | sed -E 's/.*"(https:[^"]+)"/\1/' || true)
          if [ -z "${url}" ]; then
            url="https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-linux-x86-64-universal.tar.gz"
          fi
          echo "Downloading ${url}"
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/stockfish.tar "$url"
          mkdir -p /tmp/stockfish-dist
          tar -xf /tmp/stockfish.tar -C /tmp/stockfish-dist
          binary=$(find /tmp/stockfish-dist -type f -size +1M -name 'stockfish*' | head -n1)
          test -n "${binary}"
          install -m 755 "${binary}" engines/stockfish
          find /tmp/stockfish-dist -name '*.nnue' -exec cp {} engines/ \; 2>/dev/null || true
          printf 'uci\nquit\n' | ./engines/stockfish | grep -m1 'id name'

      - name: Download Fairy-Stockfish
        run: |
          set -euo pipefail
          base="https://github.com/fairy-stockfish/Fairy-Stockfish/releases/latest/download"
          # The Linux builds have no file extension. bmi2 is 10-20% faster, but it needs CPU
          # support, so fall back to the generic build when it cannot run on the runner.
          for build in fairy-stockfish-largeboard_x86-64-bmi2 fairy-stockfish-largeboard_x86-64; do
            echo "Trying ${build}"
            if ! curl -fsSL --retry 3 --retry-delay 2 -o engines/fairy-stockfish "${base}/${build}"; then
              echo "::warning::Download failed for ${build}"
              continue
            fi
            chmod +x engines/fairy-stockfish
            if printf 'uci\nquit\n' | ./engines/fairy-stockfish > /tmp/fairy-uci.txt 2>/dev/null \
               && grep -q 'var atomic' /tmp/fairy-uci.txt; then
              grep -m1 'id name' /tmp/fairy-uci.txt
              echo "Using ${build}"
              break
            fi
            echo "::warning::${build} does not run here, trying the next build"
            rm -f engines/fairy-stockfish
          done
          # Fail before any game is started rather than in the middle of an atomic game.
          test -x engines/fairy-stockfish
          grep -q 'var atomic' /tmp/fairy-uci.txt

      - name: Download Atomic-Stockfish
        run: |
          set -euo pipefail
          base="https://github.com/Belzedar94/Atomic-Stockfish/releases/download/rolling-main"
          # Specialized atomic engine, about +150 Elo over Fairy-Stockfish at bullet speeds.
          # bmi2 is the fastest build, the others are fallbacks for weaker runner CPUs.
          for build in atomic-stockfish-linux-x86-64-bmi2 atomic-stockfish-linux-x86-64-avx2 atomic-stockfish-linux-x86-64-sse41-popcnt; do
            echo "Trying ${build}"
            if ! curl -fsSL --retry 3 --retry-delay 2 -o engines/atomic-stockfish "${base}/${build}"; then
              echo "::warning::Download failed for ${build}"
              continue
            fi
            chmod +x engines/atomic-stockfish
            if printf 'uci\nquit\n' | ./engines/atomic-stockfish > /tmp/atomic-uci.txt 2>/dev/null \
               && grep -q 'UCI_Variant' /tmp/atomic-uci.txt; then
              grep -m1 'id name' /tmp/atomic-uci.txt
              echo "Using ${build}"
              break
            fi
            echo "::warning::${build} does not run here, trying the next build"
            rm -f engines/atomic-stockfish
          done
          test -x engines/atomic-stockfish
          grep -q 'UCI_Variant' /tmp/atomic-uci.txt

      - name: Download Horde-Stockfish
        run: |
          set -uo pipefail
          base="https://github.com/Belzedar94/Horde-Stockfish/releases/download/v1.0.0"
          # Horde-Stockfish reports about +350 Elo over Fairy-Stockfish in its author's
          # release panel. The network is embedded in the binary, so only the executable is
          # installed. This step is best effort: if the build cannot run on the runner the
          # horde override is dropped and Fairy-Stockfish keeps playing that variant.
          installed=""
          for build in Horde-Stockfish-1.0.0-linux-x86-64-bmi2 Horde-Stockfish-1.0.0-linux-x86-64-avx2; do
            echo "Trying ${build}"
            if ! curl -fsSL --retry 3 --retry-delay 2 -o /tmp/horde.tar.xz "${base}/${build}.tar.xz"; then
              echo "::warning::Download failed for ${build}"
              continue
            fi
            rm -rf /tmp/horde-dist && mkdir -p /tmp/horde-dist
            tar -xf /tmp/horde.tar.xz -C /tmp/horde-dist
            binary=$(find /tmp/horde-dist -type f -name 'horde-stockfish' | head -n1)
            test -n "${binary}" || continue
            install -m 755 "${binary}" engines/horde-stockfish || continue

            printf 'uci\nquit\n' | ./engines/horde-stockfish > /tmp/horde-uci.txt 2>&1 || true
            echo "--- uci probe ---"
            head -n 4 /tmp/horde-uci.txt
            if grep -q 'UCI_Variant' /tmp/horde-uci.txt; then
              ./engines/horde-stockfish bench 16 1 1 > /tmp/horde-bench.txt 2>&1 || true
              echo "--- bench probe ---"
              tail -n 4 /tmp/horde-bench.txt
              if grep -q 'Nodes/second' /tmp/horde-bench.txt; then
                grep -m1 'id name' /tmp/horde-uci.txt
                echo "Using ${build}"
                installed="yes"
                break
              fi
            fi
            echo "::warning::${build} does not run here, trying the next build"
            rm -f engines/horde-stockfish
          done

          if [ -z "${installed}" ]; then
            echo "::warning::Horde-Stockfish is unusable on this runner, horde falls back to Fairy-Stockfish."
            sed -i '/horde: "horde-stockfish"/d' config.github.yml
            rm -f engines/horde-stockfish
          fi
          grep -n -A3 'variant_engines' config.github.yml

      - name: Check the token secret
        env:
          LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
        run: |
          if [ -z "${LICHESS_BOT_TOKEN}" ]; then
            echo "::error::Add the bot token as the LICHESS_BOT_TOKEN repository secret."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${LICHESS_BOT_TOKEN}" \
            https://lichess.org/api/account)
          if [ "$code" != "200" ]; then
            echo "::error::LICHESS_BOT_TOKEN is rejected by lichess (HTTP $code). Create a new bot token at https://lichess.org/account/oauth/token and update the secret."
            exit 1
          fi

      - name: Play
        env:
          LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
          RUN_MINUTES: ${{ inputs.minutes || 350 }}
        run: |
          set +e
          set -uo pipefail
          deadline=$(( $(date +%s) + RUN_MINUTES * 60 ))
          attempt=0
          fast_failures=0
          while :; do
            remaining=$(( deadline - $(date +%s) ))
            if [ "$remaining" -lt 120 ]; then
              echo "Time budget spent."
              break
            fi
            attempt=$(( attempt + 1 ))
            echo "Starting lichess-bot (attempt ${attempt}, ${remaining} s left)."
            started=$(date +%s)
            # SIGINT lets lichess-bot finish the running game instead of abandoning it.
            timeout --signal=INT --kill-after=180s "$remaining" \
              python lichess-bot.py --config config.github.yml --disable_auto_logging -l bot.log
            code=$?
            ran=$(( $(date +%s) - started ))
            # 124, 130 and 137 mean the scheduler stopped the bot on purpose.
            if [ "$code" -eq 0 ] || [ "$code" -ge 124 ]; then
              echo "lichess-bot stopped after ${ran} s (code ${code})."
              break
            fi
            echo "::warning::lichess-bot exited with code ${code} after ${ran} s."
            if [ "$ran" -lt 60 ]; then
              fast_failures=$(( fast_failures + 1 ))
              if [ "$fast_failures" -ge 3 ]; then
                echo "::error::lichess-bot keeps failing right after start, stopping the job."
                exit 1
              fi
            else
              fast_failures=0
            fi
            echo "Restarting in 15 s."
            sleep 15
          done

      - name: Learn from the games
        if: always()
        continue-on-error: true
        run: |
          # Analyse the games of this session and remember every blunder.
          python tools/learn_mistakes.py \
            --pgn "game_records/GlupoZavr games.pgn" \
            --book mistakes.json \
            --config config.github.yml \
            --username GlupoZavr \
            --depth 12 --threshold 150 --max-games 40

      - name: Commit the remembered mistakes
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f mistakes.json ]; then
            echo "No mistake book to commit."
            exit 0
          fi
          git config user.name "lichess-bot"
          git config user.email "lichess-bot@users.noreply.github.com"
          git add mistakes.json
          if git diff --cached --quiet; then
            echo "No new mistakes this session."
            exit 0
          fi
          git commit -m "Remember new mistakes [skip ci]"
          git push origin HEAD:main

      - name: Show the end of the log
        if: always()
        run: |
          echo "::group::Last 300 log lines"
          tail -n 300 bot.log 2>/dev/null || echo "No log file."
          echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-run-${{ github.run_id }}
          path: |
            bot.log
            game_records/
          retention-days: 7
          if-no-files-found: ignore