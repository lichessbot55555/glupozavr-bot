name: Lichess bot

# GitHub Actions caps a single job at 6 hours, so the bot plays for about 5h45m and the next
# scheduled run takes over. Cron runs are best-effort: expect 0-30 minutes of drift, which is
# why the bot stops itself well before the next start.

on:
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to run, in minutes"
        required: false
        default: "60"

permissions:
  contents: read

concurrency:
  group: lichess-bot
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Stockfish
        run: |
          set -euo pipefail
          mkdir -p engines
          api="https://api.github.com/repos/official-stockfish/Stockfish/releases/latest"
          # Take the exact asset URL the API reports, so a renamed or re-hosted release cannot break the job.
          url=$(curl -fsSL "$api" \
            | grep -oE '"browser_download_url": *"[^"]*stockfish-linux-x86-64[^"]*\.tar\.gz"' \
            | head -n1 | sed -E 's/.*"(https:[^"]+)"/\1/' || true)
          if [ -z "${url}" ]; then
            url="https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-linux-x86-64-universal.tar.gz"
          fi
          echo "Downloading ${url}"
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/stockfish.tar "$url"
          mkdir -p /tmp/stockfish-dist
          tar -xf /tmp/stockfish.tar -C /tmp/stockfish-dist
          binary=$(find /tmp/stockfish-dist -type f -size +1M -name 'stockfish*' | head -n1)
          test -n "${binary}"
          install -m 755 "${binary}" engines/stockfish
          find /tmp/stockfish-dist -name '*.nnue' -exec cp {} engines/ \; 2>/dev/null || true
          printf 'uci\nquit\n' | ./engines/stockfish | grep -m1 'id name'

      - name: Download Fairy-Stockfish
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/fairy-stockfish/Fairy-Stockfish/releases/latest"
          # The Linux build has no file extension. The closing quote in the pattern skips the
          # .exe, -bmi2 and -modern builds, which are different files for the same release.
          url=$(curl -fsSL "$api" \
            | grep -oE '"browser_download_url": *"[^"]*/fairy-stockfish-largeboard_x86-64"' \
            | head -n1 | sed -E 's/.*"(https:[^"]+)"/\1/' || true)
          if [ -z "${url}" ]; then
            url="https://github.com/fairy-stockfish/Fairy-Stockfish/releases/latest/download/fairy-stockfish-largeboard_x86-64"
          fi
          echo "Downloading ${url}"
          curl -fsSL --retry 3 --retry-delay 2 -o engines/fairy-stockfish "$url"
          chmod +x engines/fairy-stockfish
          printf 'uci\nquit\n' | ./engines/fairy-stockfish > /tmp/fairy-uci.txt
          grep -m1 'id name' /tmp/fairy-uci.txt
          # Fails the job if this build cannot play atomic, before any game is started.
          grep -q 'var atomic' /tmp/fairy-uci.txt

      - name: Check the token secret
        env:
          LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
        run: |
          if [ -z "${LICHESS_BOT_TOKEN}" ]; then
            echo "::error::Add the bot token as the LICHESS_BOT_TOKEN repository secret."
            exit 1
          fi

      - name: Play
        env:
          LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
          RUN_MINUTES: ${{ inputs.minutes || 345 }}
        run: |
          budget=$(( RUN_MINUTES * 60 ))
          echo "Running the bot for $(( budget / 60 )) minutes."
          # SIGINT lets lichess-bot finish the running game instead of abandoning it.
          # A crash must fail the job, so only the timeout exit codes are tolerated.
          set +e
          timeout --signal=INT --kill-after=120s "$budget" \
            python lichess-bot.py --config config.github.yml --disable_auto_logging -l bot.log
          code=$?
          set -e
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ] || [ "$code" -eq 130 ]; then
            echo "The bot stopped after its time budget (exit code $code)."
          else
            echo "::error::lichess-bot exited with code $code"
            exit "$code"
          fi

      - name: Show the end of the log
        if: always()
        run: |
          echo "::group::Last 300 log lines"
          tail -n 300 bot.log 2>/dev/null || echo "No log file."
          echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-run-${{ github.run_id }}
          path: |
            bot.log
            game_records/
          retention-days: 7
          if-no-files-found: ignore